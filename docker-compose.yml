services:
  # The daemon itself — opt in with: docker compose --profile full up
  # Production mode requires BAAL_INGEST_KEYS (and BAAL_ADMIN_TOKEN for the
  # admin API) in your shell or a .env file next to this compose file.
  baal:
    profiles: ['full']
    build: .
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGDATABASE: baal
      PGUSER: baal
      PGPASSWORD: baal_dev
      RABBITMQ_URL: amqp://rabbitmq
      REDIS_URL: redis://redis:6379
      BAAL_INGEST_KEYS: ${BAAL_INGEST_KEYS:-}
      BAAL_ADMIN_TOKEN: ${BAAL_ADMIN_TOKEN:-}
      BAAL_NOTIFY_WEBHOOK_URL: ${BAAL_NOTIFY_WEBHOOK_URL:-}
    ports:
      - '127.0.0.1:8787:8787'

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       baal
      POSTGRES_USER:     baal
      POSTGRES_PASSWORD: baal_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U baal -d baal']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
