name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  # Live transport path against real services — verifies what the in-memory
  # suite cannot: AMQP signature headers, DLQ policy, durable dedup,
  # migrations on a fresh database, Redis lock contention, pub/sub windows.
  live:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: baal
          POSTGRES_USER: baal
          POSTGRES_PASSWORD: baal_dev
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U baal -d baal"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      BAAL_LIVE: '1'
      RABBITMQ_URL: amqp://localhost
      REDIS_URL: redis://localhost:6379
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: baal
      PGUSER: baal
      PGPASSWORD: baal_dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:live
